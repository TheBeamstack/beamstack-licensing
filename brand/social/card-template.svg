<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Beamstack social preview card template">
  <rect width="1280" height="640" fill="#0B0E13"/>

  <!-- mark, 46x46, top-left -->
  <g transform="translate(42,38)">
    <path d="M5.75 10.06 L14.38 17.25 L5.75 24.44" fill="none" stroke="#4C8DFF" stroke-width="4.31" stroke-linecap="square" stroke-linejoin="miter"/>
    <rect x="18.69" y="8.63" width="21.56" height="3.95" fill="#E8EDF4"/>
    <rect x="18.69" y="14.73" width="21.56" height="3.95" fill="#E8EDF4"/>
    <rect x="18.69" y="20.84" width="21.56" height="3.95" fill="#E8EDF4"/>
    <rect x="3.59" y="28.03" width="38.81" height="4.31" fill="#4C8DFF"/>
    <polygon points="9.34,32.34 5.39,38.09 13.29,38.09" fill="#E8EDF4"/>
    <polygon points="36.66,32.34 32.72,38.09 40.59,38.09" fill="#E8EDF4"/>
    <rect x="31.63" y="39.53" width="10.06" height="1.72" fill="#E8EDF4"/>
  </g>

  <!-- repo name, vertically centered on the 46px mark row -->
  <text x="104" y="69" font-family="Archivo, system-ui, -apple-system, sans-serif" font-weight="700"
        font-size="34" fill="#E8EDF4" style="letter-spacing:-0.02em">{{PROJECT_NAME}}</text>

  <!-- rule -->
  <rect x="42" y="98" width="64" height="3" fill="#4C8DFF"/>

  <!-- one-line description; wrap manually across extra <text> lines (dy ~24) if it runs past ~34 characters -->
  <text x="42" y="130" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif"
        font-size="17" fill="#93A0B4">{{ONE_LINE_DESCRIPTION}}</text>

  <!-- footer, mono, uppercase, bottom-left -->
  <text x="42" y="594" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="12"
        fill="#6B7688" style="letter-spacing:.09em" text-transform="uppercase">BEAMSTACK</text>
  <text x="135" y="594" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="12"
        fill="#6B7688" style="letter-spacing:.09em" text-transform="uppercase">{{LICENCE_TAG}}</text>
  <text x="340" y="594" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="12"
        fill="#6B7688" style="letter-spacing:.09em" text-transform="uppercase">beam-stack.com</text>
</svg>
